name: build app

# CI builds the APK. The phone tests it. There is no Android SDK on the developer's
# machine and no local emulator - a local build needs roughly 10 GB of SDK.
# The Android project lives in android/ so this repository can hold both the
# researched knowledge base and the app that reads it.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'app-pipeline/data-manifest.json'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── The Android SDK, installed explicitly ──────────────────────────────
      #
      # This replaces android-actions/setup-android, which failed on this repository
      # before anything else had run. Pinning the command line tools, accepting the
      # licences and installing exactly one platform and one build-tools version makes
      # the build reproducible and removes a third-party action from the critical path.
      - name: Install the Android command line tools
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          ZIP=11076708   # commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ZIP}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept the SDK licences
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses | tail -3

      - name: Install platform 35 and build-tools 35.0.0
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      # No gradle/actions/setup-gradle here. That action failed on this repository, and the
      # committed Gradle wrapper is self-sufficient: it downloads Gradle 8.10.2 itself and
      # verifies it against the SHA-256 pinned in gradle/wrapper/gradle-wrapper.properties.
      # One less third-party action on the critical path, and the version is pinned in
      # version control rather than in a workflow.
      - name: Show the Gradle version the wrapper resolved
        run: ./gradlew --no-daemon --version

      # These three are SEPARATE steps on purpose. Combined into one, a failure anywhere
      # reports only as "Build a debug APK" and the useful part of the message is buried in
      # a log that cannot be read without admin rights. Split, the Actions UI names the
      # failing task exactly, which is all that is needed to fix it.
      - name: Compile the debug APK
        run: set -o pipefail; ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      # Splitting the steps above names the failing TASK. This names the failing LINE, and it
      # does so as a check annotation, which GitHub renders on the check itself rather than
      # inside a log that only an admin can download. A compile error should be readable from
      # the checks list; requiring a personal access token to see why a build broke is a real
      # tax on a repo where CI is the only compiler there is.
      #
      # It cannot weaken anything: `if: failure()` means it only runs after a step has already
      # failed, and it is a reporter, not a gate.
      - name: Put the compiler's own error lines on the check
        if: failure()
        continue-on-error: true
        run: |
          ESC=$(printf '\033')
          FOUND=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            FOUND=$((FOUND+1))
            # Workflow commands need % and newlines escaped, or the line is truncated.
            CLEAN=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | head -c 220)
            echo "::error title=compiler::${CLEAN}"
          done <<EOF
          $(grep -E '^e: |error: |^> Task .* FAILED|Caused by:' build.log 2>/dev/null | head -25)
          EOF
          if [ "$FOUND" -eq 0 ]; then
            echo "::notice title=compiler::no compiler error lines found in build.log - see the step log"
          else
            echo "surfaced $FOUND compiler error line(s)"
          fi

      - name: Run Android lint
        run: set -o pipefail; ./gradlew --no-daemon --console=plain lintDebug 2>&1 | tee -a build.log

      # Runs even when lint fails, and prints the full text report. Lint stops at "Lint found
      # 4 errors... First failure:" in the log, which is not enough to fix them all; the
      # complete list is in this file.
      - name: Show the lint report
        if: always()
        run: |
          REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo "===== LINT REPORT ====="
            cat "$REPORT"
            echo "===== END LINT REPORT ====="
          else
            echo "no lint report at $REPORT"
          fi

      - name: Run the unit tests
        run: set -o pipefail; ./gradlew --no-daemon --console=plain testDebugUnitTest 2>&1 | tee -a build.log

      - name: The app requests no permissions
        run: |
          set -uo pipefail
          # RULE 14. The app must ship with no permissions at all.
          #
          # One exception is unavoidable and is injected by the Android Gradle Plugin itself,
          # not by this project: com.acustad.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is a
          # signature-level permission the app defines for itself so that a registerReceiver
          # call is safe on Android 13+. It grants the app nothing and is never shown to a
          # user. Everything else is a failure.
          #
          # The grep matches 'uses-permission android:name=' rather than 'uses-permission' so
          # that the explanatory comments in the source manifest cannot trigger it.
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*' | head -1)
          echo "merged manifest: $MANIFEST"
          if [ -z "$MANIFEST" ]; then
            echo "::error::could not find the merged manifest"
            exit 1
          fi
          ALLOWED="com.acustad.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          FOUND=$(grep -o 'uses-permission android:name="[^"]*"' "$MANIFEST" | sort -u || true)
          echo "permissions in the merged manifest:"
          echo "${FOUND:-  (none)}"
          BAD=$(echo "$FOUND" | grep -v "android:name=\"$ALLOWED\"" || true)
          if [ -n "$BAD" ]; then
            echo "::error::the app must not request any permission (PERMISSIONS.md)"
            echo "$BAD"
            exit 1
          fi
          echo "no permissions beyond the AGP-injected self-permission - OK"

      - name: The APK contains no network, ads or analytics library
        run: |
          set -uo pipefail
          # RULE 14 / RULE 15, and the gate CI_CD.md §1 has documented for a long time without
          # existing. It has never mattered because the app has no network code at all - which is
          # exactly why it is dangerous to leave it unwritten. The moment an ad SDK or an update
          # check lands, the guide would claim a protection the build does not have, and the
          # app's headline promise (it works in airplane mode) would quietly stop being enforced
          # by anything.
          #
          # It is written BEFORE the ads, deliberately: a gate added after the code it forbids
          # is a gate that has to fight its way past the code it is protecting.
          #
          # ── what it checks, and why it is split in two ──
          #
          # HARD FAIL: libraries whose mere PRESENCE is a decision someone made deliberately.
          # Nothing in this app's dependency graph legitimately references any of them, so
          # there is no false-positive risk and no reason to soften them.
          #
          # REPORT ONLY: platform types that a library can reference without the app ever
          # making a call. A gate that fails on these teaches people to disable it, and a
          # disabled gate is worse than no gate. They are surfaced as annotations so a real
          # network call is still visible on the check, without breaking a build over a
          # transitive reference.
          #
          # The real enforcement for "this app must not use the network" is the PERMISSIONS
          # gate above: zero declared permissions means zero network, because `INTERNET` is a
          # normal permission and cannot be had for free. This gate is the early warning for
          # a library arriving that brings its own.
          APK=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || { echo "::error::no APK at $APK"; exit 1; }
          command -v unzip >/dev/null 2>&1 || { echo "::error::unzip is required"; exit 1; }
          command -v strings >/dev/null 2>&1 || { echo "::error::strings is required"; exit 1; }
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          # Every dex, not a hard-coded classes.dex: a multidex APK splits classes across
          # classes2.dex, classes3.dex and so on, where a library that should not be there is
          # simply invisible to a check that only opens the first file.
          unzip -qo "$APK" -d "$WORK" 'classes*.dex'
          DEX_COUNT=$(find "$WORK" -name 'classes*.dex' | wc -l)
          echo "dex files: $DEX_COUNT"
          [ "$DEX_COUNT" -gt 0 ] || { echo "::error::no dex files in the APK"; exit 1; }
          find "$WORK" -name 'classes*.dex' -print0 | xargs -0 strings > "$WORK/all.strings"
          echo "string table entries: $(wc -l < "$WORK/all.strings")"

          # ── hard fail ──
          FAILED=0
          for P in 'Lokhttp3/' 'Lretrofit2/' 'Lorg/apache/http/' \
                   'Lcom/google/android/gms/ads/' 'Lcom/facebook/ads/' \
                   'Lcom/google/firebase/' 'Lio/reactivex/rxjava3/' \
                   'Lcom/crashlytics/' 'Lio/sentry/' ; do
            if grep -qF "$P" "$WORK/all.strings"; then
              echo "::error file=build-app.yml,title=Network or ads library in the APK::found $P - RULE 14 forbids this, and it must be removed before it is ever added (PERMISSIONS.md, and the ads document when the AdMob SDK lands)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "no network, ads or analytics library in the APK - OK"
          [ "$FAILED" -eq 0 ] || exit 1

          # ── report only ──
          for P in 'Ljava/net/HttpURLConnection;' 'Ljavax/net/ssl/HttpsURLConnection;' \
                   'Ljava/net/Socket;' 'Landroid/webkit/WebView;' ; do
            if grep -qF "$P" "$WORK/all.strings"; then
              echo "::warning file=build-app.yml,title=Platform network type referenced::found $P - not a failure, because a library can reference a type the app never calls, but confirm the app does not use it"
            fi
          done
          echo "done"

      - name: The database in assets is the validated one
        run: |
          sha256sum app/src/main/assets/db/kb.sqlite
          python3 - <<'PY'
          import hashlib, sqlite3, sys, json, pathlib
          p = "app/src/main/assets/db/kb.sqlite"
          digest = hashlib.sha256(open(p, "rb").read()).hexdigest()
          print("asset sha256:", digest)
          # The app's copy must be byte-identical to the published data package, which
          # verify-data.yml checks. Catch a stale copy here, at the moment it would ship
          # inside an APK.
          manifest = pathlib.Path("../app-pipeline/data-manifest.json")
          if manifest.exists():
              expected = json.loads(manifest.read_text())["files"]["db/kb.sqlite"]["sha256"]
              if digest != expected:
                  print(f"::error::the app asset is stale\n  app     : {digest}\n  manifest: {expected}")
                  sys.exit(1)
              print("matches app-pipeline/data-manifest.json - OK")
          c = sqlite3.connect(p)
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok", "database is corrupt"
          expected_rows = {"brands": 62, "series": 320, "codes": 4418, "causes": 10450,
                           "solutions": 11776, "aliases": 7707}
          bad = []
          for t, n in expected_rows.items():
              got = c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
              print(f"  {t:10s} {got:6d} (expected {n})")
              if got != n:
                  bad.append(t)
          sys.exit(1 if bad else 0)
          PY

      - name: APK is a sane size
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          # ~12 MB: the 8.8 MB database plus the app. Anything much larger means
          # something was duplicated (ASSETS.md §5, RULE 19).
          MAX=$((25 * 1024 * 1024))
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::APK is $((SIZE / 1048576)) MB - something is duplicated"
            exit 1
          fi
          echo "size $((SIZE / 1048576)) MB - OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ac-ustad-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
