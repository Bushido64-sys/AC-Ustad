name: build-release

# Manual trigger only. This produces the signed release artifacts:
#   - app-release.apk  for Amazon Appstore / sideload
#   - app-release.aab  for Google Play (Play does not accept APKs)
# It is never run on a push because real signing keys and real ad unit IDs
# live in GitHub Secrets, which pull_request and push builds should not need
# for ordinary development.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      AD_APP_ID: ${{ secrets.AD_APP_ID }}
      AD_BANNER: ${{ secrets.AD_BANNER }}
      AD_INTERSTITIAL: ${{ secrets.AD_INTERSTITIAL }}
      AD_REWARDED: ${{ secrets.AD_REWARDED }}
      AD_NATIVE: ${{ secrets.AD_NATIVE }}
      AD_APP_OPEN: ${{ secrets.AD_APP_OPEN }}
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android command line tools
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          ZIP=11076708   # commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ZIP}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept the SDK licences
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses | tail -3

      - name: Install platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Show the Gradle version the wrapper resolved
        run: ./gradlew --no-daemon --version

      - name: Decode the release keystore
        run: |
          set -euo pipefail
          echo "b64 length: ${#RELEASE_KEYSTORE_B64}, storepass chars: ${#RELEASE_STORE_PASS}, alias chars: ${#RELEASE_KEY_ALIAS}"
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > app/release.keystore \
            || { echo "::error title=decode::RELEASE_KEYSTORE_B64 is not valid base64 - re-paste it from GITHUB_SECRETS.txt as one long line"; exit 1; }
          ls -la app/release.keystore
          openssl pkcs12 -in app/release.keystore -info -nokeys -passin "pass:$RELEASE_STORE_PASS" -noout \
            || { echo "::error title=decode::the decoded keystore does not open with RELEASE_STORE_PASS - check both secrets match GITHUB_SECRETS.txt"; exit 1; }
          keytool -list -keystore app/release.keystore -storetype PKCS12 \
            -storepass "$RELEASE_STORE_PASS" -alias "$RELEASE_KEY_ALIAS" > keytool.out 2>&1 \
            || { echo "::error title=diagnose::keytool rejected the keystore/password/alias - see the message below"; cat keytool.out; exit 1; }
          head -4 keytool.out

      - name: Assemble the release APK and AAB
        run: set -o pipefail; ./gradlew --no-daemon --console=plain assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Put the compiler's own error lines on the check
        if: failure()
        continue-on-error: true
        run: |
          ESC=$(printf '\033')
          FOUND=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            FOUND=$((FOUND+1))
            CLEAN=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | head -c 220)
            echo "::error title=compiler::${CLEAN}"
          done <<EOF
          $(grep -E '^e: |error: |^> Task .* FAILED|Caused by:' build.log 2>/dev/null | head -25)
          EOF
          if [ "$FOUND" -eq 0 ]; then
            echo "::notice title=compiler::no compiler error lines found in build.log - see the step log"
          else
            echo "surfaced $FOUND compiler error line(s)"
          fi
          # R8/shrinking failures do not print 'e:' lines — surface those too.
          grep -E 'ERROR:|FAILURE:|R8|Execution failed|error:' build.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error title=release::${l:0:200}"; done
          tail -30 build.log 2>/dev/null | while IFS= read -r l; do echo "::error title=release-log::${l:0:200}"; done

      - name: Run lint and the unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain lintRelease testDebugUnitTest 2>&1 | tee -a build.log

      - name: Verify the APK signature (v2)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::no APK at $APK"; exit 1; }
          echo "keystore secret set: $([ -n "$RELEASE_KEYSTORE_B64" ] && echo yes || echo no)"
          unzip -l "$APK" | grep -E 'META-INF/' | head -10 || true
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > signer.out 2>&1 \
            || RC=$?
          cat signer.out | while IFS= read -r l; do echo "::notice title=apksigner::${l:0:200}"; done
          [ -n "${RC:-}" ] && { echo "::error title=sign::apksigner failed to verify the release APK"; exit 1; }
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signer.out \
            && echo "v2 signature present - OK" || { echo "::error title=sign::v2 signature missing from the release APK"; exit 1; }

      - name: Verify the AAB signature (Google Play upload)
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::no AAB at $AAB"; exit 1; }
          jarsigner -verify -verbose -certs "$AAB" > aab-signer.out 2>&1 \
            || { echo "::error title=sign::jarsigner failed to verify the release AAB"; tail -40 aab-signer.out; exit 1; }
          grep -q "jar verified" aab-signer.out \
            && echo "AAB is signed and verified - OK" \
            || { echo "::error title=sign::the release AAB is not signed"; tail -40 aab-signer.out; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:" | head -4 \
            | while IFS= read -r l; do echo "::notice title=aab-cert::${l:0:200}"; done

      - name: Check package identity and Play target API
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -q "package: name='com.acustad.app'" \
            || { echo "::error::the APK package is not com.acustad.app"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='4'" \
            || { echo "::error::the APK versionCode is not 4 - bump it in android/app/build.gradle.kts"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'36'" \
            || { echo "::error::targetSdk is not 36 - Google Play rejects new apps below API 36"; exit 1; }
          echo "package, versionCode 4 and targetSdk 36 - OK"

      - name: The release artifacts contain no demo ad IDs
        run: |
          set -uo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          FOUND=0
          unzip -qo "$APK" -d "$WORK/apk" 'classes*.dex'
          find "$WORK/apk" -name 'classes*.dex' -print0 | xargs -0 strings \
            | grep -qF "ca-app-pub-3940256099942544" && FOUND=1
          unzip -qo "$AAB" -d "$WORK/aab" 'base/dex/*.dex'
          find "$WORK/aab" -name '*.dex' -print0 | xargs -0 strings \
            | grep -qF "ca-app-pub-3940256099942544" && FOUND=1
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::the release artifacts still contain Google demo ad unit IDs - real IDs were not injected"
            exit 1
          fi
          echo "no demo ad IDs in the APK or AAB - OK"

      - name: Release artifacts are a sane size
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
          MAX=$((25 * 1024 * 1024))
          for F in app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab; do
            SIZE=$(stat -c%s "$F")
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "::error::$(basename "$F") is $((SIZE / 1048576)) MB - something is duplicated"
              exit 1
            fi
            echo "$(basename "$F"): $((SIZE / 1048576)) MB - OK"
          done

      - name: Stage the store artifacts with versioned names
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/ac-ustad-1.0.1.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/ac-ustad-1.0.1.aab
          # Play Console accepts this as the deobfuscation file for R8 builds,
          # so production crash reports show real class/method names. If AGP
          # ever moves it, warn instead of failing the whole release.
          MAPPING=$(find app/build/outputs/mapping -name mapping.txt 2>/dev/null | head -1)
          if [ -n "$MAPPING" ]; then
            cp "$MAPPING" artifacts/mapping-1.0.1.txt
          else
            echo "::warning::no mapping.txt found - crash reports will be obfuscated"
          fi
          ls -lh artifacts

      # `uses:` steps do NOT inherit defaults.run.working-directory, so this path
      # must be absolute. The files are staged in android/artifacts/ by the
      # previous step, which does run inside android/.
      - uses: actions/upload-artifact@v4
        with:
          name: ac-ustad-release
          path: ${{ github.workspace }}/android/artifacts/
          retention-days: 30
          if-no-files-found: error
